  <main class="max-w-md mx-auto px-5 py-10">
    <div class="mb-8 opacity-0 animate-fade-up">
      <h1 class="text-[22px] font-semibold text-slate-900 mb-1">Генератор паролей</h1>
      <p class="text-[13px] text-slate-500">Создаётся локально. Ничего не отправляется на сервер.</p>
    </div>

    <div class="bg-white rounded-xl border border-slate-200/80 shadow-card p-6 opacity-0 animate-fade-up delay-1">
      <div class="mb-5">
        <div class="relative">
          <input id="passwordOutput" type="text" readonly class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-3 pr-20 text-[14px] font-mono text-center focus:outline-none tracking-wide">
          <button id="copyBtn" class="absolute right-2 top-1/2 -translate-y-1/2 text-[11px] font-medium text-brand-600 hover:text-brand-700 px-2.5 py-1 rounded-md hover:bg-brand-50 transition">Копировать</button>
        </div>
        <div class="mt-2.5 h-1 rounded-full bg-slate-100 overflow-hidden">
          <div id="strengthFill" class="h-full w-0 transition-all duration-300 rounded-full"></div>
        </div>
        <p id="strengthText" class="text-[11px] text-slate-400 mt-1.5 text-center">Сила пароля</p>
      </div>

      <div class="space-y-4">
        <div>
          <div class="flex justify-between text-[12px] mb-1.5">
            <label class="font-medium text-slate-600">Длина</label>
            <span id="lengthValue" class="text-brand-600 font-semibold tabular-nums">16</span>
          </div>
          <input id="lengthSlider" type="range" min="8" max="64" value="16" class="w-full accent-brand-600 h-1">
        </div>

        <div class="space-y-2">
          <label class="flex items-center gap-2.5 cursor-pointer">
            <input type="checkbox" id="upper" checked class="w-3.5 h-3.5 rounded accent-brand-600">
            <span class="text-[13px] text-slate-600">Заглавные (A–Z)</span>
          </label>
          <label class="flex items-center gap-2.5 cursor-pointer">
            <input type="checkbox" id="lower" checked class="w-3.5 h-3.5 rounded accent-brand-600">
            <span class="text-[13px] text-slate-600">Строчные (a–z)</span>
          </label>
          <label class="flex items-center gap-2.5 cursor-pointer">
            <input type="checkbox" id="numbers" checked class="w-3.5 h-3.5 rounded accent-brand-600">
            <span class="text-[13px] text-slate-600">Цифры (0–9)</span>
          </label>
          <label class="flex items-center gap-2.5 cursor-pointer">
            <input type="checkbox" id="symbols" checked class="w-3.5 h-3.5 rounded accent-brand-600">
            <span class="text-[13px] text-slate-600">Спецсимволы (!@#$)</span>
          </label>
          <label class="flex items-center gap-2.5 cursor-pointer">
            <input type="checkbox" id="excludeSimilar" class="w-3.5 h-3.5 rounded accent-brand-600">
            <span class="text-[13px] text-slate-600">Исключить похожие (0/O, 1/l)</span>
          </label>
        </div>

        <button id="generateBtn" class="btn w-full bg-brand-600 text-white py-2.5 rounded-lg text-[13px] font-medium hover:bg-brand-700 transition shadow-btn">
          Сгенерировать
        </button>
      </div>

  <footer class="border-t border-slate-200/60 bg-white">
    <div class="max-w-5xl mx-auto px-5 py-6 flex justify-between items-center text-[12px] text-slate-400">

        <span class="text-slate-600 font-medium">КвикТулс</span>
      </div>
      <a href="index.html" class="hover:text-slate-600 transition">← На главную</a>
    </div>

  <script>
    document.getElementById('menuBtn').addEventListener('click', () => document.getElementById('mobileMenu').classList.toggle('hidden'));
    const lengthSlider = document.getElementById('lengthSlider');
    const lengthValue = document.getElementById('lengthValue');
    lengthSlider.addEventListener('input', () => lengthValue.textContent = lengthSlider.value);

    function generatePassword() {
      const length = parseInt(lengthSlider.value);
      let chars = '';
      if (document.getElementById('upper').checked) chars += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      if (document.getElementById('lower').checked) chars += 'abcdefghijklmnopqrstuvwxyz';
      if (document.getElementById('numbers').checked) chars += '0123456789';
      if (document.getElementById('symbols').checked) chars += '!@#$%^&*()_+-=[]{}|;:,.<>?';
      if (document.getElementById('excludeSimilar').checked) chars = chars.replace(/[0O1lI]/g, '');
      if (!chars) { alert('Выберите символы'); return; }
      let password = '';
      const array = new Uint32Array(length);
      crypto.getRandomValues(array);
      for (let i = 0; i < length; i++) password += chars[array[i] % chars.length];
      document.getElementById('passwordOutput').value = password;
      updateStrength(password);
    }

    function updateStrength(pwd) {
      let score = 0;
      if (pwd.length >= 12) score++;
      if (pwd.length >= 16) score++;
      if (/[A-Z]/.test(pwd)) score++;
      if (/[a-z]/.test(pwd)) score++;
      if (/[0-9]/.test(pwd)) score++;
      if (/[^A-Za-z0-9]/.test(pwd)) score++;
      const fill = document.getElementById('strengthFill');
      const text = document.getElementById('strengthText');
      const colors = ['bg-red-500','bg-orange-500','bg-yellow-500','bg-lime-500','bg-green-500','bg-emerald-500'];
      const labels = ['Очень слабый','Слабый','Средний','Хороший','Сильный','Очень сильный'];
      fill.className = `h-full transition-all duration-300 rounded-full ${colors[Math.min(score,5)]}`;
      fill.style.width = `${(score/6)*100}%`;
      text.textContent = labels[Math.min(score,5)];
    }

    document.getElementById('generateBtn').addEventListener('click', generatePassword);
    document.getElementById('copyBtn').addEventListener('click', () => {
      const input = document.getElementById('passwordOutput');
      if (!input.value) return;
      navigator.clipboard.writeText(input.value).then(() => {
        const btn = document.getElementById('copyBtn');
        btn.textContent = 'Готово';
        setTimeout(() => btn.textContent = 'Копировать', 1200);
      });
    });
    generatePassword();
  </script>
