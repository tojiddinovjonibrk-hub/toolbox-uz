
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta id="metaDescription" name="description" content="Бесплатный генератор надёжных паролей PROTOOLS.">
<title id="pageTitle">Генератор паролей — PROTOOLS</title>

<script>
window.tailwind = {
  config: {
    theme: {
      extend: {
        colors: {
          brand: {
            500: '#3b82f6',
            600: '#2563eb',
            700: '#1d4ed8'
          }
        }
      }
    }
  }
};
</script>
<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
  background: #f8fafc;
  font-family: Arial, sans-serif;
}

.panel {
  background: white;
  border: 1px solid #e2e8f0;
  border-radius: 20px;
  box-shadow: 0 10px 35px rgba(15,23,42,.06);
}

input[type="checkbox"] {
  accent-color: #2563eb;
  width: 17px;
  height: 17px;
}
</style>
</head>

<body class="min-h-screen text-slate-800">

<header class="bg-white border-b">
  <div class="max-w-5xl mx-auto px-5 py-4 flex justify-between items-center">
    <a href="index.html" class="text-2xl font-black text-blue-600">PROTOOLS</a>

    <select id="language" aria-label="Language" class="border rounded-lg px-3 py-2">
      <option value="ru">Русский</option>
      <option value="en">English</option>
    </select>
  </div>
</header>

<main class="max-w-3xl mx-auto px-5 py-12">

  <div class="text-center mb-9">
    <div class="text-5xl mb-4">🔐</div>

    <h1 id="heading" class="text-3xl md:text-4xl font-black mb-3">
      Генератор паролей
    </h1>

    <p id="subtitle" class="text-slate-500">
      Создавайте надёжные пароли за несколько секунд
    </p>
  </div>

  <section class="panel p-5 md:p-8">

    <label id="passwordLabel" for="passwordOutput" class="block font-bold mb-3">
      Ваш пароль
    </label>

    <div class="flex gap-2">
      <input
        id="passwordOutput"
        type="text"
        readonly
        autocomplete="off"
        placeholder="Ваш пароль появится здесь"
        class="w-full min-w-0 bg-slate-50 border rounded-xl px-4 py-4 text-lg font-mono outline-none focus:border-blue-500"
      >

      <button id="copyBtn" type="button"
        class="bg-slate-100 hover:bg-slate-200 rounded-xl px-4 font-bold">
        Копировать
      </button>
    </div>

    <p id="copyMessage" aria-live="polite" class="text-sm text-green-600 mt-2 min-h-5"></p>

    <div class="mt-7">
      <div class="flex justify-between mb-3">
        <label id="lengthLabel" for="lengthSlider" class="font-bold">
          Длина пароля
        </label>

        <span id="lengthValue" class="font-bold text-blue-600 text-xl">16</span>
      </div>

      <input
        id="lengthSlider"
        type="range"
        min="8"
        max="64"
        value="16"
        class="w-full accent-blue-600"
      >

      <div class="flex justify-between text-xs text-slate-400 mt-1">
        <span>8</span>
        <span>64</span>
      </div>
    </div>

    <div class="mt-8">
      <h2 id="settingsTitle" class="font-bold mb-4">
        Настройки пароля
      </h2>

      <div class="grid sm:grid-cols-2 gap-4">

        <label class="flex items-center gap-3 p-3 bg-slate-50 rounded-xl">
          <input id="upper" type="checkbox" checked>
          <span id="upperLabel">Заглавные буквы (A-Z)</span>
        </label>

        <label class="flex items-center gap-3 p-3 bg-slate-50 rounded-xl">
          <input id="lower" type="checkbox" checked>
          <span id="lowerLabel">Строчные буквы (a-z)</span>
        </label>

        <label class="flex items-center gap-3 p-3 bg-slate-50 rounded-xl">
          <input id="numbers" type="checkbox" checked>
          <span id="numbersLabel">Цифры (0-9)</span>
        </label>

        <label class="flex items-center gap-3 p-3 bg-slate-50 rounded-xl">
          <input id="symbols" type="checkbox" checked>
          <span id="symbolsLabel">Символы (!@#$%)</span>
        </label>

      </div>

      <label class="flex items-center gap-3 mt-4 p-3 bg-slate-50 rounded-xl">
        <input id="excludeSimilar" type="checkbox">
        <span id="excludeLabel">Исключить похожие символы</span>
      </label>
    </div>

    <div class="mt-8">
      <div class="flex justify-between mb-2">
        <span id="strengthLabel" class="font-bold">Надёжность</span>
        <span id="strengthText" class="text-sm font-bold">—</span>
      </div>

      <div class="h-2.5 bg-slate-100 rounded-full overflow-hidden">
        <div
          id="strengthFill"
          class="h-full rounded-full transition-all"
          style="width:0%"
        ></div>
      </div>
    </div>

    <button
      id="generateBtn"
      type="button"
      class="w-full mt-8 bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl text-lg"
    >
      🔄 Создать пароль
    </button>

    <p id="errorMessage" role="alert" class="text-red-600 text-sm mt-3 text-center"></p>

  </section>

  <p id="footerText" class="text-center text-sm text-slate-400 mt-7">
    PROTOOLS — бесплатные онлайн-инструменты
  </p>

</main>

<script>
document.addEventListener('DOMContentLoaded', function () {

  const $ = id => document.getElementById(id);

  const output = $('passwordOutput');
  const slider = $('lengthSlider');
  const languageSelect = $('language');

  const translations = {

    ru: {
      title: 'Генератор паролей — PROTOOLS',
      description: 'Бесплатный генератор надёжных паролей PROTOOLS.',
      heading: 'Генератор паролей',
      subtitle: 'Создавайте надёжные пароли за несколько секунд',
      password: 'Ваш пароль',
      placeholder: 'Ваш пароль появится здесь',
      copy: 'Копировать',
      copied: 'Скопировано!',
      length: 'Длина пароля',
      settings: 'Настройки пароля',
      upper: 'Заглавные буквы (A-Z)',
      lower: 'Строчные буквы (a-z)',
      numbers: 'Цифры (0-9)',
      symbols: 'Символы (!@#$%)',
      exclude: 'Исключить похожие символы',
      strength: 'Надёжность',
      weak: 'Слабый',
      medium: 'Средний',
      strong: 'Сильный',
      generate: '🔄 Создать пароль',
      choose: 'Выберите хотя бы один тип символов.',
      error: 'Не удалось создать пароль.',
      https: 'Откройте сайт через HTTPS для безопасной генерации пароля.',
      lengthError: 'Увеличьте длину пароля.',
      footer: 'PROTOOLS — бесплатные онлайн-инструменты'
    },

    en: {
      title: 'Password Generator — PROTOOLS',
      description: 'Free secure password generator by PROTOOLS.',
      heading: 'Password Generator',
      subtitle: 'Create strong passwords in just a few seconds',
      password: 'Your password',
      placeholder: 'Your password will appear here',
      copy: 'Copy',
      copied: 'Copied!',
      length: 'Password length',
      settings: 'Password settings',
      upper: 'Uppercase letters (A-Z)',
      lower: 'Lowercase letters (a-z)',
      numbers: 'Numbers (0-9)',
      symbols: 'Symbols (!@#$%)',
      exclude: 'Exclude similar characters',
      strength: 'Password strength',
      weak: 'Weak',
      medium: 'Medium',
      strong: 'Strong',
      generate: '🔄 Generate password',
      choose: 'Select at least one character type.',
      error: 'Could not generate the password.',
      https: 'Open the website using HTTPS to generate passwords securely.',
      lengthError: 'Increase the password length.',
      footer: 'PROTOOLS — Free online tools'
    }

  };

  let lang = 'ru';

  function setLanguage(value) {

    lang = translations[value] ? value : 'ru';

    const t = translations[lang];

    document.documentElement.lang = lang;

    $('pageTitle').textContent = t.title;
    $('metaDescription').setAttribute('content', t.description);

    $('heading').textContent = t.heading;
    $('subtitle').textContent = t.subtitle;
    $('passwordLabel').textContent = t.password;

    output.placeholder = t.placeholder;

    $('copyBtn').textContent = t.copy;
    $('lengthLabel').textContent = t.length;
    $('settingsTitle').textContent = t.settings;

    $('upperLabel').textContent = t.upper;
    $('lowerLabel').textContent = t.lower;
    $('numbersLabel').textContent = t.numbers;
    $('symbolsLabel').textContent = t.symbols;
    $('excludeLabel').textContent = t.exclude;

    $('strengthLabel').textContent = t.strength;
    $('generateBtn').textContent = t.generate;
    $('footerText').textContent = t.footer;

    languageSelect.value = lang;

    try {
      localStorage.setItem('protools-language', lang);
    } catch (error) {
      // Language still works for the current page.
    }

    if (output.value) {
      updateStrength();
    }

  }

  function randomNumber(max) {

    const array = new Uint32Array(1);
    const limit = Math.floor(4294967296 / max) * max;

    do {
      window.crypto.getRandomValues(array);
    } while (array[0] >= limit);

    return array[0] % max;

  }

  function shuffle(array) {

    for (let i = array.length - 1; i > 0; i--) {

      const j = randomNumber(i + 1);

      [array[i], array[j]] = [array[j], array[i]];

    }

    return array;

  }

  function generatePassword() {

    $('errorMessage').textContent = '';
    $('copyMessage').textContent = '';

    if (!window.crypto || !window.crypto.getRandomValues) {
      $('errorMessage').textContent = translations[lang].https;
      return;
    }

    const sets = [];

    if ($('upper').checked) {
      sets.push('ABCDEFGHIJKLMNOPQRSTUVWXYZ');
    }

    if ($('lower').checked) {
      sets.push('abcdefghijklmnopqrstuvwxyz');
    }

    if ($('numbers').checked) {
      sets.push('0123456789');
    }

    if ($('symbols').checked) {
      sets.push('!@#$%^&*()_+-=[]{}|;:,.<>?');
    }

    const filtered = sets.map(set =>
      $('excludeSimilar').checked
        ? set.replace(/[0O1lI]/g, '')
        : set
    ).filter(Boolean);

    if (!filtered.length) {
      $('errorMessage').textContent = translations[lang].choose;
      return;
    }

    const length = Number(slider.value);

    if (length < filtered.length) {
      $('errorMessage').textContent = translations[lang].lengthError;
      return;
    }

    try {

      const all = filtered.join('');
      const password = [];

      // Ensure at least one character from every selected category.
      filtered.forEach(set => {
        password.push(set[randomNumber(set.length)]);
      });

      // Fill the remaining password length.
      while (password.length < length) {
        password.push(all[randomNumber(all.length)]);
      }

      output.value = shuffle(password).join('');

      updateStrength();

    } catch (error) {

      $('errorMessage').textContent = translations[lang].error;

    }

  }

  function updateStrength() {

    const password = output.value;

    if (!password) return;

    let score = 0;

    if (password.length >= 12) score++;
    if (password.length >= 16) score++;
    if (/[A-Z]/.test(password)) score++;
    if (/[a-z]/.test(password)) score++;
    if (/[0-9]/.test(password)) score++;
    if (/[^A-Za-z0-9]/.test(password)) score++;

    const fill = $('strengthFill');
    const text = $('strengthText');

    const colors = [
      'bg-red-500',
      'bg-orange-500',
      'bg-yellow-500',
      'bg-lime-500',
      'bg-green-500',
      'bg-emerald-500'
    ];

    fill.className = 'h-full rounded-full transition-all ' + colors[score];

    fill.style.width = (score / 6 * 100) + '%';

    text.textContent = score <= 2
      ? translations[lang].weak
      : score <= 4
        ? translations[lang].medium
        : translations[lang].strong;

  }

  slider.addEventListener('input', function () {

    $('lengthValue').textContent = slider.value;

    if (output.value) {
      generatePassword();
    }

  });

  $('generateBtn').addEventListener('click', generatePassword);

  $('copyBtn').addEventListener('click', async function () {

    if (!output.value) {
      generatePassword();

      if (!output.value) return;
    }

    try {

      await navigator.clipboard.writeText(output.value);

      $('copyMessage').textContent = translations[lang].copied;

    } catch (error) {

      output.focus();
      output.select();

      const copied = document.execCommand('copy');

      $('copyMessage').textContent = copied
        ? translations[lang].copied
        : translations[lang].error;

    }

  });

  ['upper', 'lower', 'numbers', 'symbols', 'excludeSimilar'].forEach(id => {

    $(id).addEventListener('change', function () {

      if (output.value) {
        generatePassword();
      }

    });

  });

  languageSelect.addEventListener('change', function () {
    setLanguage(this.value);
  });

  // Restore the language selected on other PROTOOLS pages.
  let savedLanguage = 'ru';

  try {
    savedLanguage = localStorage.getItem('protools-language') || 'ru';
  } catch (error) {
    savedLanguage = 'ru';
  }

  setLanguage(savedLanguage);

  // Generate the first password.
  generatePassword();

});
</script>

</body>
</html>
