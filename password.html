<main class="max-w-3xl mx-auto px-5 py-12">

          <input id="symbols" type="checkbox" checked>

      </div>

      <label class="flex items-center gap-3 mt-4 p-3 bg-slate-50 rounded-xl">
        <input id="excludeSimilar" type="checkbox">
        <span id="excludeLabel">Исключить похожие символы</span>
      </label>
    </div>

    <div class="mt-8">
      <div class="flex justify-between mb-2">
        <span id="strengthLabel" class="font-bold">Надёжность</span>
        <span id="strengthText" class="text-sm font-bold">—</span>
      </div>

      <div class="h-2.5 bg-slate-100 rounded-full overflow-hidden">

          class="h-full rounded-full transition-all"

        </div>

    </div>

<script>
document.addEventListener('DOMContentLoaded', function () {

  const $ = id => document.getElementById(id);

  const output = $('passwordOutput');
  const slider = $('lengthSlider');

  const translations = {

    ru: {
      title: 'Генератор паролей — PROTOOLS',
      description: 'Бесплатный генератор надёжных паролей PROTOOLS.',
      heading: 'Генератор паролей',
      subtitle: 'Создавайте надёжные пароли за несколько секунд',
      password: 'Ваш пароль',
      placeholder: 'Ваш пароль появится здесь',
      copy: 'Копировать',
      copied: 'Скопировано!',
      copyError: 'Не удалось скопировать пароль.',
      length: 'Длина пароля',
      settings: 'Настройки пароля',
      upper: 'Заглавные буквы (A-Z)',
      lower: 'Строчные буквы (a-z)',
      numbers: 'Цифры (0-9)',
      symbols: 'Символы (!@#$%)',
      exclude: 'Исключить похожие символы',
      strength: 'Надёжность',
      weak: 'Слабый',
      medium: 'Средний',
      strong: 'Сильный',
      generate: '🔄 Создать пароль',
      choose: 'Выберите хотя бы один тип символов.',
      error: 'Не удалось создать пароль.',
      https: 'Откройте сайт через HTTPS для безопасной генерации пароля.',
      lengthError: 'Увеличьте длину пароля.',
      footer: 'PROTOOLS — бесплатные онлайн-инструменты'
    },

    en: {
      title: 'Password Generator — PROTOOLS',
      description: 'Free secure password generator by PROTOOLS.',
      heading: 'Password Generator',
      subtitle: 'Create strong passwords in just a few seconds',
      password: 'Your password',
      placeholder: 'Your password will appear here',
      copy: 'Copy',
      copied: 'Copied!',
      copyError: 'Could not copy the password.',
      length: 'Password length',
      settings: 'Password settings',
      upper: 'Uppercase letters (A-Z)',
      lower: 'Lowercase letters (a-z)',
      numbers: 'Numbers (0-9)',
      symbols: 'Symbols (!@#$%)',
      exclude: 'Exclude similar characters',
      strength: 'Password strength',
      weak: 'Weak',
      medium: 'Medium',
      strong: 'Strong',
      generate: '🔄 Generate password',
      choose: 'Select at least one character type.',
      error: 'Could not generate the password.',
      https: 'Open the website using HTTPS to generate passwords securely.',
      lengthError: 'Increase the password length.',
      footer: 'PROTOOLS — Free online tools'
    }
  };

  let lang = 'ru';

  function t(key) {
    return translations[lang][key];
  }

  function setLanguage(value) {

    lang = translations[value] ? value : 'ru';

    const tr = translations[lang];

    document.documentElement.lang = lang;

    $('pageTitle').textContent = tr.title;
    $('metaDescription').content = tr.description;

    $('heading').textContent = tr.heading;
    $('subtitle').textContent = tr.subtitle;
    $('passwordLabel').textContent = tr.password;

    output.placeholder = tr.placeholder;

    $('copyBtn').textContent = tr.copy;
    $('lengthLabel').textContent = tr.length;
    $('settingsTitle').textContent = tr.settings;

    $('upperLabel').textContent = tr.upper;
    $('lowerLabel').textContent = tr.lower;
    $('numbersLabel').textContent = tr.numbers;
    $('symbolsLabel').textContent = tr.symbols;
    $('excludeLabel').textContent = tr.exclude;

    $('strengthLabel').textContent = tr.strength;
    $('generateBtn').textContent = tr.generate;
    $('footerText').textContent = tr.footer;

    $('langBtn').textContent = lang === 'ru' ? 'EN' : 'RU';

    $('menuBtn').setAttribute(
      'aria-label',
      lang === 'ru' ? 'Открыть меню' : 'Open menu'
    );

    document.querySelectorAll('[data-ru][data-en]').forEach(el => {
      el.textContent = el.getAttribute('data-' + lang);
    });

    try {
      localStorage.setItem('protools-language', lang);
    } catch (error) {}

    if (output.value) updateStrength();

  }

  // SECURE RANDOM NUMBER
  function randomNumber(max) {

    if (!Number.isSafeInteger(max) || max < 1) {
      throw new Error('Invalid random range');
    }

    const array = new Uint32Array(1);
    const range = 4294967296;
    const limit = Math.floor(range / max) * max;

    do {
      window.crypto.getRandomValues(array);
    } while (array[0] >= limit);

    return array[0] % max;
  }

  // SECURE SHUFFLE
  function shuffle(array) {

    for (let i = array.length - 1; i > 0; i--) {

      const j = randomNumber(i + 1);

      [array[i], array[j]] = [array[j], array[i]];

    }

    return array;
  }

  // PASSWORD GENERATION
  function generatePassword() {

    $('errorMessage').textContent = '';
    $('copyMessage').textContent = '';

    if (!window.crypto || !window.crypto.getRandomValues) {
      $('errorMessage').textContent = t('https');
      return;
    }

    const sets = [];

    if ($('upper').checked) {
      sets.push('ABCDEFGHIJKLMNOPQRSTUVWXYZ');
    }

    if ($('lower').checked) {
      sets.push('abcdefghijklmnopqrstuvwxyz');
    }

    if ($('numbers').checked) {
      sets.push('0123456789');
    }

    if ($('symbols').checked) {
      sets.push('!@#$%^&*()_+-=[]{}|;:,.<>?');
    }

    const filtered = sets.map(set =>
      $('excludeSimilar').checked
        ? set.replace(/[0O1lI]/g, '')
        : set
    ).filter(Boolean);

    if (!filtered.length) {
      output.value = '';
      resetStrength();
      $('errorMessage').textContent = t('choose');
      return;
    }

    const length = Number(slider.value);

    if (length < filtered.length) {
      output.value = '';
      resetStrength();
      $('errorMessage').textContent = t('lengthError');
      return;
    }

    try {

      const all = filtered.join('');
      const password = [];

      filtered.forEach(set => {
        password.push(set[randomNumber(set.length)]);
      });

      while (password.length < length) {
        password.push(all[randomNumber(all.length)]);
      }

      output.value = shuffle(password).join('');

      updateStrength();

    } catch (error) {

      output.value = '';
      resetStrength();
      $('errorMessage').textContent = t('error');

    }
  }

  // STRENGTH INDICATOR
  function resetStrength() {
    $('strengthFill').style.width = '0%';
    $('strengthFill').className = 'h-full rounded-full transition-all';
    $('strengthText').textContent = '—';
  }

  function updateStrength() {

    const password = output.value;

    if (!password) {
      resetStrength();
      return;
    }

    let score = 0;

    if (password.length >= 12) score++;
    if (password.length >= 16) score++;
    if (/[A-Z]/.test(password)) score++;
    if (/[a-z]/.test(password)) score++;
    if (/[0-9]/.test(password)) score++;
    if (/[^A-Za-z0-9]/.test(password)) score++;

    const fill = $('strengthFill');
    const text = $('strengthText');

    const colors = [
      'bg-red-500',
      'bg-orange-500',
      'bg-yellow-500',
      'bg-lime-500',
      'bg-green-500',
      'bg-emerald-500'
    ];

    fill.className =
      'h-full rounded-full transition-all ' + colors[score];

    fill.style.width = (score / 6 * 100) + '%';

    text.textContent = score <= 2
      ? t('weak')
      : score <= 4
        ? t('medium')
        : t('strong');
  }

  // SLIDER
  slider.addEventListener('input', function () {

    $('lengthValue').textContent = slider.value;

    if (output.value) {
      generatePassword();
    }

  });

  // GENERATE BUTTON
  $('generateBtn').addEventListener('click', generatePassword);

  // COPY BUTTON
  $('copyBtn').addEventListener('click', async function () {

    if (!output.value) {
      generatePassword();

      if (!output.value) return;
    }

    try {

      if (!navigator.clipboard || !navigator.clipboard.writeText) {
        throw new Error('Clipboard unavailable');
      }

      await navigator.clipboard.writeText(output.value);

      $('copyMessage').textContent = t('copied');

    } catch (error) {

      output.focus();
      output.select();

      let copied = false;

      try {
        copied = document.execCommand('copy');
      } catch (e) {}

      $('copyMessage').textContent = copied
        ? t('copied')
        : t('copyError');

    }

  });

  // SETTINGS
  ['upper', 'lower', 'numbers', 'symbols', 'excludeSimilar'].forEach(id => {

    $(id).addEventListener('change', function () {

      if (output.value) {
        generatePassword();
      }

    });

  });

  // LANGUAGE
  $('langBtn').addEventListener('click', function () {
    setLanguage(lang === 'ru' ? 'en' : 'ru');
  });

  // MOBILE MENU
  $('menuBtn').addEventListener('click', function () {

    const hidden = $('mobileMenu').classList.toggle('hidden');

    $('menuBtn').setAttribute('aria-expanded', String(!hidden));

  });

  $('mobileMenu').querySelectorAll('a').forEach(link => {
    link.addEventListener('click', function () {
      $('mobileMenu').classList.add('hidden');
      $('menuBtn').setAttribute('aria-expanded', 'false');
    });
  });

  // RESTORE SHARED LANGUAGE
  let savedLanguage = 'ru';

  try {
    savedLanguage = localStorage.getItem('protools-language') || 'ru';
  } catch (error) {}

  setLanguage(savedLanguage);

  // FIRST PASSWORD
  $('lengthValue').textContent = slider.value;
  generatePassword();

});
</script>
