          <span id="lengthValue" class="text-brand-600 font-semibold">16</span>
        </div>
        <input id="lengthSlider" type="range" min="8" max="64" value="16"
          class="w-full accent-brand-600">
      </div>

      <div class="border-t border-slate-100 pt-4 space-y-3">
        <label class="flex items-center gap-2.5 cursor-pointer">
          <input type="checkbox" id="upper" checked class="w-4 h-4 accent-brand-600">
          <span class="text-sm text-slate-600" data-i18n="upper">Заглавные (A–Z)</span>
        </label>

        <label class="flex items-center gap-2.5 cursor-pointer">
          <input type="checkbox" id="lower" checked class="w-4 h-4 accent-brand-600">
          <span class="text-sm text-slate-600" data-i18n="lower">Строчные (a–z)</span>
        </label>

        <label class="flex items-center gap-2.5 cursor-pointer">
          <input type="checkbox" id="numbers" checked class="w-4 h-4 accent-brand-600">
          <span class="text-sm text-slate-600" data-i18n="numbers">Цифры (0–9)</span>
        </label>

        <label class="flex items-center gap-2.5 cursor-pointer">
          <input type="checkbox" id="symbols" checked class="w-4 h-4 accent-brand-600">
          <span class="text-sm text-slate-600" data-i18n="symbols">Спецсимволы (!@#$)</span>
        </label>

        <label class="flex items-center gap-2.5 cursor-pointer">
          <input type="checkbox" id="excludeSimilar" class="w-4 h-4 accent-brand-600">
          <span class="text-sm text-slate-600" data-i18n="exclude">Исключить похожие (0/O, 1/l)</span>
        </label>

      <button id="generateBtn"
        class="btn w-full bg-brand-600 text-white py-3 rounded-lg text-sm font-medium hover:bg-brand-700 shadow-btn"

        Сгенерировать пароль

<script>
const translations = {
  ru: {
    qr: 'QR-коды',
    converter: 'Конвертер',
    compress: 'Сжатие',
    password: 'Пароли',
    premium: 'Премиум',
    title: 'Генератор паролей',
    subtitle: 'Пароль создаётся прямо в браузере. Данные никуда не отправляются.',
    yourPassword: 'Ваш пароль',
    copy: 'Копировать',
    copied: 'Скопировано!',
    strength: 'Сила пароля',
    length: 'Длина пароля',
    upper: 'Заглавные (A–Z)',
    lower: 'Строчные (a–z)',
    numbers: 'Цифры (0–9)',
    symbols: 'Спецсимволы (!@#$)',
    exclude: 'Исключить похожие (0/O, 1/l)',
    generate: 'Сгенерировать пароль',
    privacy: 'Генерация выполняется локально в вашем браузере.',
    home: '← На главную',
    error: 'Выберите хотя бы один тип символов.',
    weak: 'Слабый',
    medium: 'Средний',
    good: 'Хороший',
    strong: 'Сильный',
    veryStrong: 'Очень сильный',
    unavailable: 'Ваш браузер не поддерживает безопасную генерацию паролей.'
  },
  uz: {
    qr: 'QR-kodlar',
    converter: 'Konvertor',
    compress: 'Siqish',
    password: 'Parollar',
    premium: 'Premium',
    title: 'Parol generatori',
    subtitle: 'Parol brauzeringizda yaratiladi. Ma’lumotlar serverga yuborilmaydi.',
    yourPassword: 'Sizning parolingiz',
    copy: 'Nusxalash',
    copied: 'Nusxalandi!',
    strength: 'Parol mustahkamligi',
    length: 'Parol uzunligi',
    upper: 'Katta harflar (A–Z)',
    lower: 'Kichik harflar (a–z)',
    numbers: 'Raqamlar (0–9)',
    symbols: 'Maxsus belgilar (!@#$)',
    exclude: 'O‘xshash belgilarni chiqarib tashlash (0/O, 1/l)',
    generate: 'Parol yaratish',
    privacy: 'Parol brauzeringizda mahalliy tarzda yaratiladi.',
    home: '← Bosh sahifa',
    error: 'Kamida bitta belgi turini tanlang.',
    weak: 'Kuchsiz',
    medium: 'O‘rtacha',
    good: 'Yaxshi',
    strong: 'Kuchli',
    veryStrong: 'Juda kuchli',
    unavailable: 'Brauzeringiz xavfsiz parol yaratishni qo‘llab-quvvatlamaydi.'
  }
};

const $ = id => document.getElementById(id);
let currentLanguage = 'ru';

function setLanguage(lang) {
  currentLanguage = lang;
  document.documentElement.lang = lang;

  document.querySelectorAll('[data-i18n]').forEach(element => {
    const key = element.dataset.i18n;
    if (translations[lang][key]) {
      element.textContent = translations[lang][key];
    }
  });

  $('language').value = lang;
  updateStrength($('passwordOutput').value);
}

$('language').addEventListener('change', event => {
  setLanguage(event.target.value);
});

$('menuBtn').addEventListener('click', () => {
  $('mobileMenu').classList.toggle('hidden');
});

const slider = $('lengthSlider');

slider.addEventListener('input', () => {
  $('lengthValue').textContent = slider.value;
});

function randomInt(max) {
  if (!Number.isSafeInteger(max) || max <= 0) {
    throw new Error('Invalid random range');
  }

  const limit = Math.floor(4294967296 / max) * max;
  const values = new Uint32Array(1);
  let value;

  do {
    crypto.getRandomValues(values);
    value = values[0];
  } while (value >= limit);

  return value % max;
}

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = randomInt(i + 1);
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

function getCharacterSets() {
  const exclude = $('excludeSimilar').checked;

  let sets = [];

  if ($('upper').checked) sets.push('ABCDEFGHIJKLMNOPQRSTUVWXYZ');
  if ($('lower').checked) sets.push('abcdefghijklmnopqrstuvwxyz');
  if ($('numbers').checked) sets.push('0123456789');
  if ($('symbols').checked) sets.push('!@#$%^&*()_+-=[]{}|;:,.<>?');

  if (exclude) {
    sets = sets.map(set => set.replace(/[0O1lI]/g, ''));
  }

  return sets.filter(set => set.length > 0);
}

function generatePassword() {
  $('errorMessage').classList.add('hidden');
  $('copyMessage').classList.add('hidden');

  if (!window.crypto || !crypto.getRandomValues) {
    $('errorMessage').textContent = translations[currentLanguage].unavailable;
    $('errorMessage').classList.remove('hidden');
    return;
  }

  const length = Number(slider.value);
  const sets = getCharacterSets();

  if (sets.length === 0) {
    $('errorMessage').textContent = translations[currentLanguage].error;
    $('errorMessage').classList.remove('hidden');
    return;
  }

  if (length < sets.length) {
    $('errorMessage').textContent = currentLanguage === 'ru'
      ? 'Увеличьте длину пароля, чтобы вместить все выбранные типы символов.'
      : 'Barcha tanlangan belgilar turlari uchun parol uzunligini oshiring.';
    $('errorMessage').classList.remove('hidden');
    return;
  }

  const allCharacters = sets.join('');
  const password = [];

  // Добавляем минимум один символ каждого выбранного типа.
  for (const set of sets) {
    password.push(set[randomInt(set.length)]);
  }

  // Заполняем оставшуюся длину.
  while (password.length < length) {
    password.push(allCharacters[randomInt(allCharacters.length)]);
  }

  shuffle(password);

  const result = password.join('');
  $('passwordOutput').value = result;
  updateStrength(result);
}

function updateStrength(password) {
  const fill = $('strengthFill');
  const text = $('strengthText');

  if (!password) {
    fill.style.width = '0%';
    fill.className = 'h-full rounded-full';
    text.textContent = translations[currentLanguage].strength;
    return;
  }

  let score = 0;
  const sets = getCharacterSets();

  if (password.length >= 12) score++;
  if (password.length >= 16) score++;
  if (sets.length >= 2) score++;
  if (sets.length >= 3) score++;
  if (sets.length >= 4) score++;

  const levels = [
    { color: 'bg-red-500', label: translations[currentLanguage].weak },
    { color: 'bg-orange-500', label: translations[currentLanguage].weak },
    { color: 'bg-yellow-500', label: translations[currentLanguage].medium },
    { color: 'bg-lime-500', label: translations[currentLanguage].good },
    { color: 'bg-green-500', label: translations[currentLanguage].strong },
    { color: 'bg-emerald-500', label: translations[currentLanguage].veryStrong }
  ];

  const level = levels[Math.min(score, 5)];

  fill.className = `h-full rounded-full transition-all duration-300 ${level.color}`;
  fill.style.width = `${Math.max(10, score / 5 * 100)}%`;
  text.textContent = level.label;
}

$('generateBtn').addEventListener('click', generatePassword);

$('copyBtn').addEventListener('click', async () => {
  const password = $('passwordOutput').value;
  if (!password) return;

  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(password);
    } else {
      $('passwordOutput').focus();
      $('passwordOutput').select();

      const copied = document.execCommand('copy');
      if (!copied) throw new Error('Copy failed');
    }

    $('copyBtn').textContent = translations[currentLanguage].copied;
    $('copyMessage').textContent = translations[currentLanguage].copied;
    $('copyMessage').classList.remove('hidden');

    setTimeout(() => {
      $('copyBtn').textContent = translations[currentLanguage].copy;
      $('copyMessage').classList.add('hidden');
    }, 1500);

  } catch (error) {
    $('copyMessage').textContent = currentLanguage === 'ru'
      ? 'Не удалось скопировать. Выделите пароль вручную.'
      : 'Nusxalash amalga oshmadi. Parolni qo‘lda belgilang.';
    $('copyMessage').classList.remove('hidden');
  }
});

// Начальная настройка.
setLanguage('ru');
generatePassword();
</script>
