
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Бесплатный генератор надёжных паролей PROTOOLS.">
  <title>Генератор паролей — PROTOOLS</title>

  <script>
    window.tailwind = {
      config: {
        theme: {
          extend: {
            colors: {
              brand: {
                50: '#eff6ff',
                100: '#dbeafe',
                500: '#3b82f6',
                600: '#2563eb',
                700: '#1d4ed8'
              }
            }
          }
        }
      }
    };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      background: #f8fafc;
      font-family: Arial, sans-serif;
    }
    .panel {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(15, 23, 42, .05);
    }
    button { transition: .2s; }
    button:active { transform: scale(.97); }
    input[type="checkbox"] { accent-color: #2563eb; }
  </style>
</head>

<body class="min-h-screen text-slate-800">

<header class="bg-white border-b border-slate-200">
  <div class="max-w-5xl mx-auto px-5 py-4 flex justify-between items-center">
    <a href="index.html" class="text-2xl font-black text-blue-600">PROTOOLS</a>
    <select id="language" class="border rounded-lg px-3 py-2 text-sm">
      <option value="ru">Русский</option>
      <option value="uz">O‘zbekcha</option>
    </select>
  </div>
</header>

<main class="max-w-3xl mx-auto px-5 py-12">
  <div class="text-center mb-9">
    <div class="text-5xl mb-4">🔐</div>
    <h1 id="heading" class="text-3xl md:text-4xl font-black mb-3">
      Генератор паролей
    </h1>
    <p id="subtitle" class="text-slate-500">
      Создавайте надёжные пароли за несколько секунд
    </p>
  </div>

  <section class="panel p-5 md:p-8">
    <label id="passwordLabel" class="block font-bold mb-3">
      Ваш пароль
    </label>

    <div class="flex gap-2">
      <input
        id="passwordOutput"
        type="text"
        readonly
        placeholder="Нажмите «Создать пароль»"
        class="w-full min-w-0 bg-slate-50 border border-slate-200 rounded-xl px-4 py-4 text-lg font-mono outline-none focus:border-blue-500"
      >
      <button
        id="copyBtn"
        class="bg-slate-100 hover:bg-slate-200 rounded-xl px-4 font-bold"
        type="button"
      >Копировать</button>
    </div>

    <p id="copyMessage" class="text-sm text-green-600 mt-2 min-h-5"></p>

    <div class="mt-7">
      <div class="flex justify-between items-center mb-3">
        <label id="lengthLabel" class="font-bold">Длина пароля</label>
        <span id="lengthValue" class="font-bold text-blue-600 text-xl">16</span>
      </div>
      <input
        id="lengthSlider"
        type="range"
        min="8"
        max="64"
        value="16"
        class="w-full accent-blue-600"
      >
      <div class="flex justify-between text-xs text-slate-400 mt-1">
        <span>8</span><span>64</span>
      </div>
    </div>

    <div class="mt-8">
      <h2 id="settingsTitle" class="font-bold mb-4">Настройки пароля</h2>

      <div class="grid sm:grid-cols-2 gap-4">
        <label class="flex items-center gap-3 p-3 bg-slate-50 rounded-xl">
          <input id="upper" type="checkbox" checked>
          <span id="upperLabel">Заглавные буквы (A-Z)</span>
        </label>

        <label class="flex items-center gap-3 p-3 bg-slate-50 rounded-xl">
          <input id="lower" type="checkbox" checked>
          <span id="lowerLabel">Строчные буквы (a-z)</span>
        </label>

        <label class="flex items-center gap-3 p-3 bg-slate-50 rounded-xl">
          <input id="numbers" type="checkbox" checked>
          <span id="numbersLabel">Цифры (0-9)</span>
        </label>

        <label class="flex items-center gap-3 p-3 bg-slate-50 rounded-xl">
          <input id="symbols" type="checkbox" checked>
          <span id="symbolsLabel">Символы (!@#$%)</span>
        </label>
      </div>

      <label class="flex items-center gap-3 mt-4 p-3 bg-slate-50 rounded-xl">
        <input id="excludeSimilar" type="checkbox">
        <span id="excludeLabel">Исключить похожие символы (i, l, 1, O, 0)</span>
      </label>
    </div>

    <div class="mt-8">
      <div class="flex justify-between mb-2">
        <span id="strengthLabel" class="font-bold">Надёжность</span>
        <span id="strengthText" class="text-sm font-bold text-green-600">—</span>
      </div>
      <div class="h-2.5 bg-slate-100 rounded-full overflow-hidden">
        <div id="strengthFill" class="h-full bg-green-500 rounded-full" style="width:0%"></div>
      </div>
    </div>

    <button
      id="generateBtn"
      type="button"
      class="w-full mt-8 bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl text-lg"
    >
      🔄 Создать пароль
    </button>

    <p id="errorMessage" class="text-red-600 text-sm mt-3 text-center"></p>
  </section>

  <p id="footerText" class="text-center text-sm text-slate-400 mt-7">
    PROTOOLS — бесплатные онлайн-инструменты
  </p>
</main>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const $ = id => document.getElementById(id);

  const translations = {
    ru: {
      heading: 'Генератор паролей',
      subtitle: 'Создавайте надёжные пароли за несколько секунд',
      password: 'Ваш пароль',
      placeholder: 'Нажмите «Создать пароль»',
      copy: 'Копировать',
      copied: 'Пароль скопирован!',
      length: 'Длина пароля',
      settings: 'Настройки пароля',
      upper: 'Заглавные буквы (A-Z)',
      lower: 'Строчные буквы (a-z)',
      numbers: 'Цифры (0-9)',
      symbols: 'Символы (!@#$%)',
      exclude: 'Исключить похожие символы (i, l, 1, O, 0)',
      strength: 'Надёжность',
      weak: 'Слабый',
      medium: 'Средний',
      strong: 'Надёжный',
      generate: '🔄 Создать пароль',
      choose: 'Выберите хотя бы один тип символов.',
      secureError: 'Ваш браузер не поддерживает безопасную генерацию паролей.',
      footer: 'PROTOOLS — бесплатные онлайн-инструменты'
    },
    uz: {
      heading: 'Parol generatori',
      subtitle: 'Bir necha soniyada ishonchli parollar yarating',
      password: 'Sizning parolingiz',
      placeholder: '«Parol yaratish» tugmasini bosing',
      copy: 'Nusxalash',
      copied: 'Parol nusxalandi!',
      length: 'Parol uzunligi',
      settings: 'Parol sozlamalari',
      upper: 'Katta harflar (A-Z)',
      lower: 'Kichik harflar (a-z)',
      numbers: 'Raqamlar (0-9)',
      symbols: 'Belgilar (!@#$%)',
      exclude: 'O‘xshash belgilarni chiqarib tashlash',
      strength: 'Ishonchlilik',
      weak: 'Zaif',
      medium: 'O‘rtacha',
      strong: 'Ishonchli',
      generate: '🔄 Parol yaratish',
      choose: 'Kamida bitta belgi turini tanlang.',
      secureError: 'Brauzeringiz xavfsiz parol yaratishni qo‘llab-quvvatlamaydi.',
      footer: 'PROTOOLS — bepul onlayn vositalar'
    }
  };

  let lang = 'ru';

  const output = $('passwordOutput');
  const slider = $('lengthSlider');

  function setLanguage(value) {
    lang = value;
    const t = translations[lang];

    $('heading').textContent = t.heading;
    $('subtitle').textContent = t.subtitle;
    $('passwordLabel').textContent = t.password;
    output.placeholder = t.placeholder;
    $('copyBtn').textContent = t.copy;
    $('lengthLabel').textContent = t.length;
    $('settingsTitle').textContent = t.settings;
    $('upperLabel').textContent = t.upper;
    $('lowerLabel').textContent = t.lower;
    $('numbersLabel').textContent = t.numbers;
    $('symbolsLabel').textContent = t.symbols;
    $('excludeLabel').textContent = t.exclude;
    $('strengthLabel').textContent = t.strength;
    $('generateBtn').textContent = t.generate;
    $('footerText').textContent = t.footer;

    if (output.value) updateStrength();
  }

  $('language').addEventListener('change', e => {
    setLanguage(e.target.value);
  });

  slider.addEventListener('input', () => {
    $('lengthValue').textContent = slider.value;
  });

  function randomInt(max) {
    if (!window.crypto || !window.crypto.getRandomValues) {
      throw new Error(translations[lang].secureError);
    }

    const array = new Uint32Array(1);
    const limit = Math.floor(4294967296 / max) * max;

    do {
      window.crypto.getRandomValues(array);
    } while (array[0] >= limit);

    return array[0] % max;
  }

  function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
      const j = randomInt(i + 1);
      [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
  }

  function generatePassword() {
    $('errorMessage').textContent = '';
    $('copyMessage').textContent = '';

    const groups = [];

    if ($('upper').checked) groups.push('ABCDEFGHIJKLMNOPQRSTUVWXYZ');
    if ($('lower').checked) groups.push('abcdefghijklmnopqrstuvwxyz');
    if ($('numbers').checked) groups.push('0123456789');
    if ($('symbols').checked) groups.push('!@#$%^&*()-_=+[]{};:,.?');

    if (groups.length === 0) {
      $('errorMessage').textContent = translations[lang].choose;
      return;
    }

    const similar = 'il1Lo0O';
    const exclude = $('excludeSimilar').checked;

    const filteredGroups = groups.map(group =>
      exclude ? [...group].filter(char => !similar.includes(char)).join('') : group
    ).filter(Boolean);

    if (filteredGroups.length === 0) {
      $('errorMessage').textContent = translations[lang].choose;
      return;
    }

    try {
      const length = Number(slider.value);
      const allChars = filteredGroups.join('');
      const password = [];

      // Сначала добавляем символ из каждой выбранной категории.
      filteredGroups.forEach(group => {
        password.push(group[randomInt(group.length)]);
      });

      // Заполняем оставшуюся длину.
      while (password.length < length) {
        password.push(allChars[randomInt(allChars.length)]);
      }

      output.value = shuffle(password).join('');
      updateStrength();
    } catch (error) {
      $('errorMessage').textContent =
        error.message || translations[lang].secureError;
    }
  }

  function updateStrength() {
    const length = output.value.length;
    const categories = [
      $('upper').checked,
      $('lower').checked,
      $('numbers').checked,
      $('symbols').checked
    ].filter(Boolean).length;

    const score = length >= 20 && categories >= 3 ? 3 :
                  length >= 12 && categories >= 2 ? 2 : 1;

    const fill = $('strengthFill');
    const text = $('strengthText');

    if (score === 3) {
      fill.style.width = '100%';
      fill.className = 'h-full bg-green-500 rounded-full';
      text.textContent = translations[lang].strong;
      text.className = 'text-sm font-bold text-green-600';
    } else if (score === 2) {
      fill.style.width = '65%';
      fill.className = 'h-full bg-yellow-500 rounded-full';
      text.textContent = translations[lang].medium;
      text.className = 'text-sm font-bold text-yellow-600';
    } else {
      fill.style.width = '30%';
      fill.className = 'h-full bg-red-500 rounded-full';
      text.textContent = translations[lang].weak;
      text.className = 'text-sm font-bold text-red-600';
    }
  }

  $('generateBtn').addEventListener('click', generatePassword);

  $('copyBtn').addEventListener('click', async () => {
    if (!output.value) {
      generatePassword();
      if (!output.value) return;
    }

    try {
      await navigator.clipboard.writeText(output.value);
      $('copyMessage').textContent = translations[lang].copied;
    } catch {
      output.focus();
      output.select();
      const success = document.execCommand('copy');
      $('copyMessage').textContent = success
        ? translations[lang].copied
        : 'Выделите пароль и скопируйте его вручную.';
    }
  });

  ['upper', 'lower', 'numbers', 'symbols', 'excludeSimilar'].forEach(id => {
    $(id).addEventListener('change', () => {
      if (output.value) generatePassword();
    });
  });

  setLanguage('ru');
  generatePassword();
});
</script>

</body>
</html>
