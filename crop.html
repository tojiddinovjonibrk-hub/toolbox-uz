
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Crop images online for free with PROTOOLS. Upload, crop and download images directly in your browser.">
<title>Crop Images Online Free — PROTOOLS</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #0b1020;
    color: #fff;
    min-height: 100vh;
}

header {
    padding: 22px 8%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #252d42;
}

.logo {
    font-size: 27px;
    font-weight: 800;
    color: #6c8cff;
    text-decoration: none;
}

.back {
    color: #b9c5e2;
    text-decoration: none;
}

.container {
    max-width: 950px;
    margin: 55px auto;
    padding: 20px;
}

h1 {
    text-align: center;
    font-size: 38px;
    margin-bottom: 12px;
}

.subtitle {
    text-align: center;
    color: #9ba8c7;
    margin-bottom: 35px;
}

.panel {
    background: #151d32;
    border: 1px solid #283550;
    border-radius: 18px;
    padding: 25px;
}

.upload {
    border: 2px dashed #526baf;
    padding: 35px 15px;
    text-align: center;
    border-radius: 13px;
    cursor: pointer;
    background: #10182b;
    margin-bottom: 25px;
}

.upload:hover {
    border-color: #8da5ff;
}

.upload input {
    display: none;
}

.upload h3 {
    margin-bottom: 10px;
}

.upload p {
    color: #9ba8c7;
    font-size: 14px;
}

#preview {
    display: block;
    max-width: 100%;
    max-height: 480px;
    margin: 20px auto;
    border-radius: 10px;
}

.controls {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 20px;
    justify-content: center;
}

button {
    padding: 13px 22px;
    border: none;
    border-radius: 9px;
    cursor: pointer;
    font-weight: bold;
    font-size: 14px;
    background: #263653;
    color: white;
}

button:hover {
    opacity: .85;
}

.primary {
    background: #617fff;
}

button:disabled {
    opacity: .4;
    cursor: not-allowed;
}

input[type="number"] {
    width: 90px;
    padding: 10px;
    background: #0b1020;
    color: white;
    border: 1px solid #35425e;
    border-radius: 7px;
}

.settings {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 20px;
}

.settings label {
    color: #c1cce5;
    font-size: 14px;
}

footer {
    text-align: center;
    color: #7583a4;
    padding: 30px;
    font-size: 13px;
}

@media(max-width:600px) {
    h1 { font-size: 29px; }
    header { padding: 18px 5%; }
    .panel { padding: 15px; }
}
</style>
</head>

<body>

<header>
    <a href="index.html" class="logo">PROTOOLS</a>
    <a href="index.html" class="back">← Home</a>
</header>

<main class="container">

    <h1>Image Cropper</h1>
    <p class="subtitle">
        Crop your images online quickly and easily.
    </p>

    <section class="panel">

        <label class="upload" for="file">
            <h3>📁 Upload an Image</h3>
            <p>Click here to select JPG, PNG or WebP</p>
            <input type="file" id="file" accept="image/png,image/jpeg,image/webp">
        </label>

        <canvas id="preview"></canvas>

        <div class="settings">
            <label>
                X:
                <input type="number" id="x" value="0" min="0">
            </label>

            <label>
                Y:
                <input type="number" id="y" value="0" min="0">
            </label>

            <label>
                Width:
                <input type="number" id="width" value="0" min="1">
            </label>

            <label>
                Height:
                <input type="number" id="height" value="0" min="1">
            </label>
        </div>

        <div class="controls">
            <button id="reset" disabled>Reset</button>
            <button id="crop" class="primary" disabled>✂ Crop Image</button>
            <button id="download" disabled>⬇ Download</button>
        </div>

        <p id="status" style="text-align:center;margin-top:20px;color:#9ba8c7">
            Upload an image to get started.
        </p>

    </section>
</main>

<footer>
    © 2026 PROTOOLS. All rights reserved.
</footer>

<script>
const fileInput = document.getElementById("file");
const canvas = document.getElementById("preview");
const ctx = canvas.getContext("2d");

const xInput = document.getElementById("x");
const yInput = document.getElementById("y");
const widthInput = document.getElementById("width");
const heightInput = document.getElementById("height");

const cropBtn = document.getElementById("crop");
const resetBtn = document.getElementById("reset");
const downloadBtn = document.getElementById("download");
const status = document.getElementById("status");

let image = new Image();
let originalWidth = 0;
let originalHeight = 0;
let croppedBlob = null;

fileInput.addEventListener("change", function(e) {
    const file = e.target.files[0];

    if (!file) return;

    if (!["image/jpeg", "image/png", "image/webp"].includes(file.type)) {
        status.textContent = "Please select a JPG, PNG or WebP image.";
        return;
    }

    const url = URL.createObjectURL(file);

    image.onload = function() {
        originalWidth = image.naturalWidth;
        originalHeight = image.naturalHeight;

        canvas.width = originalWidth;
        canvas.height = originalHeight;

        ctx.drawImage(image, 0, 0);

        xInput.value = 0;
        yInput.value = 0;
        widthInput.value = originalWidth;
        heightInput.value = originalHeight;

        [xInput, yInput, widthInput, heightInput].forEach(input => {
            input.max = originalWidth;
        });

        croppedBlob = null;
        cropBtn.disabled = false;
        resetBtn.disabled = false;
        downloadBtn.disabled = true;

        status.textContent = `Image loaded: ${originalWidth} × ${originalHeight}`;

        URL.revokeObjectURL(url);
    };

    image.onerror = function() {
        status.textContent = "Could not load this image.";
        URL.revokeObjectURL(url);
    };

    image.src = url;
});

resetBtn.addEventListener("click", function() {
    if (!originalWidth) return;

    xInput.value = 0;
    yInput.value = 0;
    widthInput.value = originalWidth;
    heightInput.value = originalHeight;

    ctx.drawImage(image, 0, 0);

    croppedBlob = null;
    downloadBtn.disabled = true;
    status.textContent = "Crop settings reset.";
});

cropBtn.addEventListener("click", function() {
    if (!originalWidth) return;

    const x = Number(xInput.value);
    const y = Number(yInput.value);
    const w = Number(widthInput.value);
    const h = Number(heightInput.value);

    if (
        !Number.isInteger(x) ||
        !Number.isInteger(y) ||
        !Number.isInteger(w) ||
        !Number.isInteger(h) ||
        x < 0 || y < 0 ||
        w <= 0 || h <= 0 ||
        x + w > originalWidth ||
        y + h > originalHeight
    ) {
        status.textContent = "Invalid crop area. Check your coordinates and dimensions.";
        return;
    }

    const output = document.createElement("canvas");
    output.width = w;
    output.height = h;

    const outputCtx = output.getContext("2d");

    outputCtx.drawImage(
        image,
        x, y, w, h,
        0, 0, w, h
    );

    canvas.width = w;
    canvas.height = h;
    ctx.drawImage(output, 0, 0);

    output.toBlob(function(blob) {
        if (!blob) {
            status.textContent = "Could not crop this image.";
            return;
        }

        croppedBlob = blob;
        downloadBtn.disabled = false;
        status.textContent = `Successfully cropped: ${w} × ${h}`;
    }, "image/png");
});

downloadBtn.addEventListener("click", function() {
    if (!croppedBlob) return;

    const url = URL.createObjectURL(croppedBlob);
    const link = document.createElement("a");

    link.href = url;
    link.download = "protools-cropped-image.png";
    link.click();

    URL.revokeObjectURL(url);
});
</script>

</body>
</html>
